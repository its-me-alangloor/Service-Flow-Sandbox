<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Flow Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      Babel.registerPreset('custom-react', {
        presets: [
          [Babel.availablePresets['react'], { runtime: 'classic' }]
        ]
      });
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .dragging {
            opacity: 0.4;
            background-color: #f1f5f9 !important;
        }
        .drag-over {
            border-top: 3px solid #2563eb !important;
        }
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        @media print {
            html, body { background: white !important; color: black !important; }
            @page { size: portrait; margin: 15mm; }
            .no-print { display: none !important; }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            table { width: 100% !important; border: 1px solid #e2e8f0 !important; }
            th {
                background-color: #0f172a !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .section-label-input {
                border: none !important;
                color: #2563eb !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 900 !important;
            }
            .total-row {
                background-color: #f8fafc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="custom-react">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            }); 
            return (
                <i 
                    data-lucide={name} 
                    style={{ width: size, height: size }} 
                    className={`inline-block ${className}`}
                ></i>
            );
        };

        const INITIAL_DATA = {
            "2026-03-01": {
                title: "Service Plan",
                subtitle: "Weekly Flow",
                items: [
                    { id: 1, section: "GATHERING", length: "20:00", item: "Call to Worship", notes: "" },
                    { id: 2, section: "WORD", length: "36:00", item: "Sermon", notes: "" },
                    { id: 3, section: "TABLE", length: "4:00", item: "Communion", notes: "" },
                    { id: 4, section: "SENDING", length: "5:00", item: "Benediction", notes: "" }
                ]
            }
        };

        const parseLocalDate = (dateStr) => {
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        };

        const formatDuration = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        };

        const parseDurationToSeconds = (durationStr) => {
            if (!durationStr) return 0;
            const parts = durationStr.split(':');
            if (parts.length === 2) {
                return (parseInt(parts[0], 10) * 60) + (parseInt(parts[1], 10) || 0);
            }
            return (parseInt(parts[0], 10) * 60) || 0;
        };

        function App() {
            const [currentDate, setCurrentDate] = useState("2026-03-01");
            const [services, setServices] = useState(INITIAL_DATA);
            const [draggedItemIndex, setDraggedItemIndex] = useState(null);
            const [dragOverIndex, setDragOverIndex] = useState(null);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const handleUpdateItem = (id, field, value) => {
                setServices(prev => {
                    const currentItems = prev[currentDate].items;
                    const updatedItems = currentItems.map(item => 
                        item.id === id ? { ...item, [field]: value } : item
                    );
                    return { 
                        ...prev, 
                        [currentDate]: { 
                            ...prev[currentDate], 
                            items: updatedItems 
                        } 
                    };
                });
            };

            const addItem = (index) => {
                const prevItem = services[currentDate].items[index];
                const newItem = {
                    id: Date.now() + Math.random(), 
                    section: prevItem ? prevItem.section : "NEW SECTION",
                    length: "5:00",
                    item: "New Item",
                    notes: ""
                };
                setServices(prev => {
                    const newItems = [...prev[currentDate].items];
                    newItems.splice(index + 1, 0, newItem);
                    return { 
                        ...prev, 
                        [currentDate]: { 
                            ...prev[currentDate], 
                            items: newItems 
                        } 
                    };
                });
            };

            const removeItem = (id) => {
                setServices(prev => {
                    const newItems = prev[currentDate].items.filter(i => i.id !== id);
                    return { 
                        ...prev, 
                        [currentDate]: { 
                            ...prev[currentDate], 
                            items: newItems 
                        } 
                    };
                });
            };

            const onDragStart = (index) => setDraggedItemIndex(index);
            const onDragOver = (e, index) => {
                e.preventDefault();
                setDragOverIndex(index);
            };

            const onDrop = () => {
                if (draggedItemIndex === null || dragOverIndex === null) return;
                const newItems = [...services[currentDate].items];
                const [removed] = newItems.splice(draggedItemIndex, 1);
                newItems.splice(dragOverIndex, 0, removed);
                setServices(prev => ({
                    ...prev,
                    [currentDate]: { ...prev[currentDate], items: newItems }
                }));
                setDraggedItemIndex(null);
                setDragOverIndex(null);
            };

            const onDragEnd = () => {
                setDraggedItemIndex(null);
                setDragOverIndex(null);
            };

            const addNewDate = () => {
                const dates = Object.keys(services).sort();
                const lastDate = parseLocalDate(dates[dates.length - 1]);
                const nextDate = new Date(lastDate);
                nextDate.setDate(lastDate.getDate() + 7);
                const dateStr = nextDate.toISOString().split('T')[0];
                setServices({
                    ...services,
                    [dateStr]: {
                        ...services[currentDate],
                        title: services[currentDate].title,
                        subtitle: services[currentDate].subtitle,
                        items: services[currentDate].items.map(item => ({ 
                            ...item, 
                            id: Date.now() + Math.random() 
                        }))
                    }
                });
                setCurrentDate(dateStr);
            };

            const updateCurrentDateKey = (newDateStr) => {
                if (!newDateStr || services[newDateStr]) return;
                const newServices = { ...services };
                newServices[newDateStr] = newServices[currentDate];
                delete newServices[currentDate];
                setServices(newServices);
                setCurrentDate(newDateStr);
            };

            const deleteDate = (dateToDelete) => {
                if (Object.keys(services).length <= 1) return;
                const remaining = Object.keys(services).filter(d => d !== dateToDelete).sort();
                const newServices = { ...services };
                delete newServices[dateToDelete];
                setServices(newServices);
                if (currentDate === dateToDelete) setCurrentDate(remaining[0]);
            };

            const calculateTotalLength = () => {
                if (!services[currentDate] || !services[currentDate].items) return "0:00";
                const totalSeconds = services[currentDate].items.reduce((acc, item) => {
                    return acc + parseDurationToSeconds(item.length);
                }, 0);
                return formatDuration(totalSeconds);
            };

            const currentService = services[currentDate] || { title: "", subtitle: "", items: [] };

            return (
                <div className="p-4 md:p-8">
                    <div className="max-w-6xl mx-auto print-container">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 no-print">
                            <div className="flex items-center gap-4">
                                <h1 className="text-2xl font-black text-slate-900 flex items-center gap-2 uppercase tracking-tighter">
                                    <Icon name="play-circle" className="text-blue-600" />
                                    Service Flow
                                </h1>
                                <div className="flex bg-white rounded-lg shadow-sm border p-1 overflow-x-auto max-w-full items-center">
                                    {Object.keys(services).sort().map(date => (
                                        <div key={date} className="relative group flex items-center">
                                            <button
                                                onClick={() => setCurrentDate(date)}
                                                className={`px-3 py-1.5 rounded-md transition-all text-xs font-bold whitespace-nowrap ${
                                                    currentDate === date 
                                                        ? 'bg-blue-600 text-white shadow-sm' 
                                                        : 'text-slate-600 hover:bg-slate-100'
                                                }`}
                                            >
                                                {parseLocalDate(date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                                            </button>
                                            {Object.keys(services).length > 1 && (
                                                <button 
                                                    onClick={() => deleteDate(date)}
                                                    className="ml-1 mr-1 p-0.5 text-slate-300 hover:text-red-500 transition-colors"
                                                >
                                                    <Icon name="x" size={12} />
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <button 
                                        onClick={addNewDate} 
                                        className="p-1.5 text-blue-600 hover:bg-blue-50 rounded-md transition-colors"
                                        title="Add Next Week"
                                    >
                                        <Icon name="plus" size={16} />
                                    </button>
                                </div>
                            </div>
                            <button 
                                onClick={() => window.print()} 
                                className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all"
                            >
                                <Icon name="printer" size={16} /> Print Sheet
                            </button>
                        </div>

                        {/* Document Content Box */}
                        <div className="bg-white rounded-xl shadow-md border border-slate-200/80 p-6 md:p-8 print-container">
                            <div className="border-b border-slate-100 pb-6 mb-6">
                                <div className="flex flex-col md:flex-row justify-between items-start gap-4">
                                    <div className="flex-1 w-full">
                                        <input 
                                            type="text"
                                            value={currentService.title}
                                            onChange={e => setServices({...services, [currentDate]: {...currentService, title: e.target.value}})}
                                            className="text-3xl font-black text-slate-900 outline-none border-b border-transparent focus:border-blue-500 w-full tracking-tight uppercase"
                                        />
                                        <input 
                                            type="text"
                                            value={currentService.subtitle}
                                            onChange={e => setServices({...services, [currentDate]: {...currentService, subtitle: e.target.value}})}
                                            className="text-lg font-bold text-slate-500 outline-none border-b border-transparent focus:border-blue-500 w-full mt-1"
                                        />
                                    </div>
                                    <div className="text-right flex flex-col items-end w-full md:w-auto">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1 no-print">Service Date</label>
                                        <input 
                                            type="date"
                                            value={currentDate}
                                            onChange={(e) => updateCurrentDateKey(e.target.value)}
                                            className="text-right text-sm font-bold text-slate-600 bg-slate-50 border px-3 py-1.5 rounded outline-none no-print"
                                        />
                                        <div className="hidden print:block text-sm font-bold text-slate-400 uppercase tracking-widest">
                                            {parseLocalDate(currentDate).toLocaleDateString(undefined, { dateStyle: 'full' })}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Flow Table Layout */}
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b-2 border-slate-900/10 text-[11px] font-black tracking-wider text-slate-400 uppercase bg-slate-50/70">
                                            <th className="p-3 w-8 no-print"></th>
                                            <th className="p-3 w-1/4">Section</th>
                                            <th className="p-3 w-24">Length</th>
                                            <th className="p-3 w-1/3">Item Element</th>
                                            <th className="p-3">Technical / Creative Notes</th>
                                            <th className="p-3 w-16 text-center no-print"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentService.items.map((item, index) => (
                                            <tr 
                                                key={item.id}
                                                draggable
                                                onDragStart={() => onDragStart(index)}
                                                onDragOver={(e) => onDragOver(e, index)}
                                                onDrop={onDrop}
                                                onDragEnd={onDragEnd}
                                                className={`border-b border-slate-100 hover:bg-slate-50/50 transition-colors group ${draggedItemIndex === index ? 'dragging' : ''} ${dragOverIndex === index ? 'drag-over' : ''}`}
                                            >
                                                <td className="p-3 text-center no-print">
                                                    <div className="drag-handle text-slate-300 group-hover:text-slate-400 transition-colors">
                                                        <Icon name="grip-vertical" size={14} />
                                                    </div>
                                                </td>
                                                <td className="p-2">
                                                    <input 
                                                        type="text" 
                                                        value={item.section}
                                                        onChange={(e) => handleUpdateItem(item.id, 'section', e.target.value.toUpperCase())}
                                                        className="section-label-input w-full bg-transparent px-2 py-1.5 font-black text-xs tracking-wider text-blue-600 uppercase rounded border border-transparent focus:bg-white focus:border-slate-200 outline-none"
                                                    />
                                                </td>
                                                <td className="p-2">
                                                    <input 
                                                        type="text" 
                                                        value={item.length}
                                                        onChange={(e) => handleUpdateItem(item.id, 'length', e.target.value)}
                                                        className="w-full bg-transparent px-2 py-1.5 font-mono text-sm text-slate-700 font-bold rounded border border-transparent focus:bg-white focus:border-slate-200 outline-none"
                                                        placeholder="0:00"
                                                    />
                                                </td>
                                                <td className="p-2">
                                                    <input 
                                                        type="text" 
                                                        value={item.item}
                                                        onChange={(e) => handleUpdateItem(item.id, 'item', e.target.value)}
                                                        className="w-full bg-transparent px-2 py-1.5 text-sm font-bold text-slate-800 rounded border border-transparent focus:bg-white focus:border-slate-200 outline-none"
                                                    />
                                                </td>
                                                <td className="p-2">
                                                    <input 
                                                        type="text" 
                                                        value={item.notes}
                                                        onChange={(e) => handleUpdateItem(item.id, 'notes', e.target.value)}
                                                        className="w-full bg-transparent px-2 py-1.5 text-sm text-slate-500 font-medium rounded border border-transparent focus:bg-white focus:border-slate-200 outline-none"
                                                        placeholder="Add tech or cues..."
                                                    />
                                                </td>
                                                <td className="p-2 text-center no-print">
                                                    <div className="flex items-center justify-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button 
                                                            onClick={() => addItem(index)}
                                                            className="p-1 text-slate-400 hover:text-blue-600 rounded"
                                                            title="Insert Item Below"
                                                        >
                                                            <Icon name="plus" size={14} />
                                                        </button>
                                                        {currentService.items.length > 1 && (
                                                            <button 
                                                                onClick={() => removeItem(item.id)}
                                                                className="p-1 text-slate-400 hover:text-red-500 rounded"
                                                                title="Delete Item"
                                                            >
                                                                <Icon name="trash-2" size={14} />
                                                            </button>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr className="total-row border-t-2 border-slate-900/10 font-bold text-slate-800">
                                            <td className="p-3 no-print"></td>
                                            <td className="p-3 text-xs tracking-wider uppercase text-slate-500 font-black">Total Duration</td>
                                            <td className="p-3 font-mono text-sm font-extrabold text-blue-600">{calculateTotalLength()}</td>
                                            <td colSpan="3" className="p-3"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
